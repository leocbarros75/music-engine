name: Engine tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: npm ci --prefix apps/electron
      - run: npm run build --prefix apps/electron
